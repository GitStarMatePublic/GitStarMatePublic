name: "领取 5 个推广积分"
description: "提交 GithubStarMate Account ID，领取一次性推广积分奖励"
title: "[推广积分] "
body:
  - type: markdown
    attributes:
      value: |
        ## 领取 5 个推广积分

        请先在 [GithubStarMate](https://www.githubstarmate.com/) 注册账号。从你的 GithubStarMate 账户页面复制 Account ID，然后填写此表单。账号确认后，你将获得 5 个推广积分。

        > 每个账号仅限领取一次。请勿填写密码、访问令牌、邮箱地址或其他敏感信息。

  - type: input
    id: githubstarmate-account-id
    attributes:
      label: "GithubStarMate Account ID"
      description: "请从你的 GithubStarMate 账户页面复制 Account ID"
      placeholder: "你的 GithubStarMate Account ID"
    validations:
      required: true

  - type: checkboxes
    id: eligibility
    attributes:
      label: "领取资格确认"
      options:
        - label: "我已在 GithubStarMate 注册账号。"
          required: true
        - label: "此账号此前未领取过这 5 个推广积分。"
          required: true
