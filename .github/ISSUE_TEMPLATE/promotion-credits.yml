name: "Claim 5 Promotion Credits"
description: "Submit your registered GithubStarMate account to claim the one-time reward"
title: "[Promotion Credits] "
body:
  - type: markdown
    attributes:
      value: |
        ## Claim 5 promotion credits

        Register at [GithubStarMate](https://www.githubstarmate.com/) first, then complete this form. After your account is confirmed, you will receive 5 promotion credits.

        > Each account may claim this reward only once. Never include your password, access token, or other sensitive information.

  - type: input
    id: githubstarmate-account
    attributes:
      label: "GithubStarMate registered account"
      description: "Enter the account identifier you registered with"
      placeholder: "Your GithubStarMate account"
    validations:
      required: true

  - type: input
    id: repository
    attributes:
      label: "Repository to promote (optional)"
      description: "Paste the full GitHub repository URL"
      placeholder: "https://github.com/username/repository"
    validations:
      required: false

  - type: checkboxes
    id: eligibility
    attributes:
      label: "Eligibility confirmation"
      options:
        - label: "I have registered at GithubStarMate."
          required: true
        - label: "This account has not claimed the 5 promotion credits before."
          required: true
