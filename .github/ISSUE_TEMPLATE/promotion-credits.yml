name: "Claim 5 Promotion Credits"
description: "Submit your GithubStarMate Account ID to claim the one-time reward"
title: "[Promotion Credits] "
body:
  - type: markdown
    attributes:
      value: |
        ## Claim 5 promotion credits

        Register at [GithubStarMate](https://www.githubstarmate.com/) first. Copy the Account ID shown on your GithubStarMate account page, then complete this form. After your account is confirmed, you will receive 5 promotion credits.

        > Each account may claim this reward only once. Never include your password, access token, email address, or other sensitive information.

  - type: input
    id: githubstarmate-account-id
    attributes:
      label: "GithubStarMate Account ID"
      description: "Copy the Account ID shown on your GithubStarMate account page"
      placeholder: "Your GithubStarMate Account ID"
    validations:
      required: true

  - type: checkboxes
    id: eligibility
    attributes:
      label: "Eligibility confirmation"
      options:
        - label: "I have registered at GithubStarMate."
          required: true
        - label: "This account has not claimed the 5 promotion credits before."
          required: true
